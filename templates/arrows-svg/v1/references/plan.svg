<svg data-theme="light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1196 884" role="img" aria-label="Piper landing network map">
<style>
:root, svg { --ink:#1b1a17; --paper:#f4efe3; --run:#d1331f; --trail:#1f6fb8; --gnaw:#e3a40b; --sniff:#1b8a4a; --hoard:#7a4fa3; --tail:#b9858a; }
@media (prefers-color-scheme: dark) { svg { --ink:#ece6d8; --paper:#15140f; --run:#ff5a3d; --trail:#4ea3f2; --gnaw:#ffc23a; --sniff:#3fcf7a; --hoard:#b58ae6; --tail:#e3aab0; } }
svg[data-theme="light"] { --ink:#1b1a17; --paper:#f4efe3; --run:#d1331f; --trail:#1f6fb8; --gnaw:#e3a40b; --sniff:#1b8a4a; --hoard:#7a4fa3; --tail:#b9858a; }
svg[data-theme="dark"] { --ink:#ece6d8; --paper:#15140f; --run:#ff5a3d; --trail:#4ea3f2; --gnaw:#ffc23a; --sniff:#3fcf7a; --hoard:#b58ae6; --tail:#e3aab0; }
.line { fill:none; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
.ring { fill:var(--paper); stroke:var(--ink); stroke-width:3.5; }
.dot { fill:var(--paper); stroke:var(--ink); stroke-width:3; }
.lbl { font:600 15px/1 "Avenir Next","Gill Sans","Helvetica Neue",sans-serif; fill:var(--ink); letter-spacing:.02em; }
.big { font-size:19px; font-weight:800; }
.title { font:800 34px/1 "Avenir Next","Gill Sans",sans-serif; fill:var(--ink); letter-spacing:.12em; }
.sub { font:italic 500 15px/1 "Avenir Next","Gill Sans",sans-serif; fill:var(--ink); opacity:.75; }
.paw { fill:var(--ink); opacity:.55; }
.tail { fill:none; stroke:var(--tail); stroke-width:4; stroke-linecap:round; }
.cheese { fill:var(--gnaw); stroke:var(--ink); stroke-width:1.5; }
.hole { fill:var(--paper); }
.bite { fill:none; stroke:var(--paper); stroke-width:5; stroke-linecap:round; }
.scratch { fill:none; stroke:var(--ink); stroke-width:1.6; opacity:.22; stroke-linecap:round; }
.nibble { fill:none; stroke:var(--ink); stroke-width:2; opacity:.5; }
</style>
<defs><filter id="gnaw-clean" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter></defs>
<text x="70" y="64" class="title">PIPER</text>
<text x="220" y="62" class="sub">leads your rats to the nest · drawn by rats</text>
